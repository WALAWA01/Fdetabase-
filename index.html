<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahaweli Authority | Secure Registry v5.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #003566;
            --accent: #ffc300;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #1d3557;
            --error: #ff5555;
            --mahaweli-blue: #002e70; 
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            margin: 0;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- ADVANCED SECURITY UI --- */
        #passwordOverlay {
            position: fixed;
            inset: 0;
            background: #000814;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 53, 102, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 195, 0, 0.05) 0%, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: all 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            color: white;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.03), transparent);
            transform: rotate(45deg);
            animation: shimmer 6s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .security-icon {
            width: 70px;
            height: 70px;
            background: rgba(255, 195, 0, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--accent);
            border: 1px solid rgba(255, 195, 0, 0.3);
            font-size: 1.8rem;
        }

        .auth-card input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px;
            border-radius: 16px;
            width: 100%;
            box-sizing: border-box;
            font-size: 1.5rem;
            text-align: center;
            color: var(--accent);
            letter-spacing: 6px;
            margin: 20px 0;
        }

        .btn-auth {
            background: var(--accent);
            color: var(--primary);
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* --- DASHBOARD UI --- */
        header {
            background: white;
            padding: 15px 0;
            border-bottom: 3px solid var(--mahaweli-blue);
        }

        .logo-bar {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-group img {
            height: 80px;
            width: auto;
            object-fit: contain;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            border-left: 2px solid #eee;
            padding-left: 20px;
        }

        .title-sinhala {
            font-size: 1.5rem;
            font-weight: 700;
            color: #000;
            line-height: 1.2;
        }

        .title-english {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--mahaweli-blue);
            margin: 2px 0;
        }

        .title-tamil {
            font-size: 1.1rem;
            color: #444;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            width: 90%;
        }

        .glass-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) { 
            .search-grid { grid-template-columns: 1fr; }
            .logo-bar { flex-direction: column; text-align: center; }
            .title-group { border: none; padding: 0; }
        }

        .input-group label {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            margin-bottom: 8px;
            color: #6c757d;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #f1f3f5;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; color: #adb5bd; font-size: 0.8rem; }
        td { padding: 15px; border-top: 1px solid #f8f9fa; }

        .btn-print {
            background: #2b9348;
            color: white;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            border: none;
            font-weight: 700;
            margin-top: 20px;
            cursor: pointer;
            display: none;
        }

        @media print {
            #passwordOverlay, .btn-print { display: none !important; }
            .container { width: 100%; margin: 0; }
            .glass-card { box-shadow: none; }
        }
    </style>
</head>
<body>

<div id="passwordOverlay">
    <div class="auth-card" id="authCard">
        <div class="security-icon"><i class="fas fa-fingerprint"></i></div>
        <h2 style="margin:0">Database Encrypted</h2>
        <p>Verification Required for Access</p>
        <input type="password" id="passInput" placeholder="••••••" maxlength="6">
        <button class="btn-auth" onclick="verify()">Authorize Access</button>
        <p id="errMsg" style="color:var(--error); font-size: 0.8rem; display:none; margin-top:15px; font-weight:bold;">ACCESS DENIED: INVALID TOKEN</p>
    </div>
</div>

<header>
    <div class="logo-bar">
        <div class="logo-group">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Emblem_of_Sri_Lanka.svg/1200px-Emblem_of_Sri_Lanka.svg.png" alt="Sri Lanka Emblem">
            <img src="https://lh6.googleusercontent.com/proxy/U2iNl1Qr-pKG0T-b8629Egg5e7k7u_748QaLMsYDJ9V1GrfK-wFJJVKTT1rDNywOEmrH20ILsVZgwSDNWf6LHpZBb_ZVDAsJBaP4soOGVYFPWBMZDJ4R2Z4BJ1jDnXCMhlOXG4Ckcg" alt="Mahaweli Logo" onerror="this.src='https://via.placeholder.com/80?text=MASL'">
        </div>
        
        <div class="title-group">
            <div class="title-sinhala">ශ්‍රී ලංකා මහවැලි අධිකාරිය</div>
            <div class="title-english">Mahaweli Authority of Sri Lanka</div>
            <div class="title-tamil">இலங்கை மகாவலி அதிகாரசபை</div>
        </div>
    </div>
</header>

<div class="container">
    <div class="glass-card">
        <div class="search-grid">
            <div class="input-group">
                <label><i class="fas fa-users"></i> Society Name</label>
                <input type="text" id="socSearch" onkeyup="handleSearch('soc')" placeholder="Search by society...">
            </div>
            <div class="input-group">
                <label><i class="fas fa-id-card"></i> NIC / ID Number</label>
                <input type="text" id="idSearch" onkeyup="handleSearch('id')" placeholder="Search by NIC...">
            </div>
        </div>

        <div id="resultsContent" style="display:none;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Member Name</th>
                            <th>Society</th>
                            <th>ID Number</th>
                            <th>Contact</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <button class="btn-print" id="printBtn" onclick="window.print()">
                <i class="fas fa-print"></i> Generate Official Report
            </button>
        </div>

        <div id="noData" style="display:none; text-align:center; padding:40px;">
            <i class="fas fa-database" style="font-size:2.5rem; color:#dee2e6; margin-bottom:10px;"></i>
            <p style="color:#adb5bd">No matching records found in the current registry.</p>
        </div>
    </div>
</div>

<script>
    const db = [
        { name: "Supun", society: "Gamunu", phone: "071 307 1005", id: "993120723v" },
        { name: "Jayasooriya", society: "Gamunu", phone: "N/A", id: "982356753v" },
        { name: "Pradeep", society: "Udawalawa", phone: "N/A", id: "199901107" },
        { name: "Susantha", society: "Gamunu", phone: "071 307 1005", id: "983120723v" },
        { name: "hasitha", society: "Gamunu", phone: "N/A", id: "862356753v" },
        { name: "gamini", society: "Gamunu", phone: "071 307 1005", id: "883120723v" },
        { name: "lakshan", society: "Gamunu", phone: "N/A", id: "712356753v" },
        { name: "samantha", society: "Gamunu", phone: "071 307 1005", id: "903120723v" },
        { name: "kavinda", society: "Gamunu", phone: "N/A", id: "952356753v" },
        { name: "rukshila", society: "Gamunu", phone: "071 307 1005", id: "753120723v" },
        { name: "devinda", society: "Gamunu", phone: "N/A", id: "802356753v" },
    ];

    function verify() {
        const pin = document.getElementById('passInput');
        const card = document.getElementById('authCard');
        if(pin.value === "553455") {
            document.getElementById('passwordOverlay').style.opacity = "0";
            setTimeout(() => document.getElementById('passwordOverlay').style.display = "none", 600);
        } else {
            card.classList.add('shake');
            document.getElementById('errMsg').style.display = "block";
            pin.value = "";
            setTimeout(() => card.classList.remove('shake'), 400);
        }
    }

    function handleSearch(mode) {
        const sVal = document.getElementById('socSearch').value.toLowerCase();
        const iVal = document.getElementById('idSearch').value.toLowerCase();
        if(mode === 'soc') document.getElementById('idSearch').value = ""; else document.getElementById('socSearch').value = "";
        const query = mode === 'soc' ? sVal : iVal;
        if(!query) {
            document.getElementById('resultsContent').style.display = "none";
            document.getElementById('noData').style.display = "none";
            return;
        }
        const filtered = db.filter(item => mode === 'soc' ? item.society.toLowerCase().includes(query) : item.id.toLowerCase().includes(query));
        render(filtered);
    }

    function render(list) {
        const body = document.getElementById('tableBody');
        const content = document.getElementById('resultsContent');
        const noData = document.getElementById('noData');
        const printBtn = document.getElementById('printBtn');
        body.innerHTML = "";
        if(list.length > 0) {
            content.style.display = "block"; noData.style.display = "none"; printBtn.style.display = "block";
            list.forEach(row => {
                body.innerHTML += `<tr><td style="font-weight:600">${row.name}</td><td><span style="background:#eef2ff; color:#4361ee; padding:5px 10px; border-radius:6px; font-weight:700; font-size:0.75rem;">${row.society}</span></td><td style="font-family:monospace; color:#e63946; font-weight:600;">${row.id}</td><td>${row.phone}</td></tr>`;
            });
        } else { content.style.display = "none"; noData.style.display = "block"; }
    }

    document.getElementById('passInput').addEventListener("keypress", (e) => { if(e.key === "Enter") verify(); });
</script>

</body>
</html>
